<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Watermark to PDF Online | ToolRivo</title><meta name="description" content="Add a text watermark to every page of a PDF online for free."><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><style>body{font-family:Arial;background:#f5f7fa;color:#102331}.wrap{max-width:760px;margin:60px auto;padding:28px;background:white;border-radius:20px}.btn{padding:12px 18px;border:0;border-radius:10px;background:#126e68;color:white;font-weight:700;cursor:pointer}</style></head><body><div class="wrap"><a href="index.html">← ToolRivo</a><h1>Watermark PDF</h1><input id="f" type="file" accept="application/pdf"><br><input id="w" placeholder="Watermark text" value="ToolRivo"><br><button class="btn" onclick="run()">Add Watermark</button><p id="s"></p></div><script>async function run(){const f=document.querySelector('#f').files[0];if(!f)return s.textContent='Choose a PDF.';const t=document.querySelector('#w').value||'ToolRivo';s.textContent='Processing...';try{const p=await PDFLib.PDFDocument.load(await f.arrayBuffer());p.getPages().forEach(x=>{const {width,height}=x.getSize();x.drawText(t,{x:width/2-70,y:height/2,size:28,opacity:.18,rotate:PDFLib.degrees(35),color:PDFLib.rgb(.2,.45,.45)})});const b=await p.save();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([b],{type:'application/pdf'}));a.download='watermarked.pdf';a.click();s.textContent='Done.'}catch(e){s.textContent='Could not process this PDF.'}}</script></body></html>
