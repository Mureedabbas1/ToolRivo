<style>
:root{
  --bg:#070b1a;--ink:#eef1ff;--muted:#b9c1e8;
  --a:#22d3ee;--b:#7c5cff;--pink:#ff4fa3;
  --line:rgba(255,255,255,.16);
  --head:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:100px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.55;position:relative;overflow-x:clip;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
a{color:inherit;text-decoration:none}
h1,h2,h3{margin:0}
p{margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-left:24px;padding-right:24px;position:relative;z-index:1}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;z-index:100;background:#fff;color:#0b1020;padding:10px 16px;border-radius:10px;font-weight:700}
.skip:focus{left:12px}
:focus-visible{outline:2px solid var(--a);outline-offset:3px;border-radius:10px}

/* ---------- Background glow ---------- */
.bg{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.blob{position:absolute;border-radius:50%;filter:blur(120px)}
.b1{left:-180px;top:-140px;width:520px;height:520px;background:var(--b);opacity:.55}
.b2{right:-160px;top:140px;width:480px;height:480px;background:var(--a);opacity:.38}
.b3{left:28%;top:900px;width:460px;height:460px;background:var(--pink);opacity:.26}
.b4{right:2%;top:1700px;width:440px;height:440px;background:var(--b);opacity:.38}
.b5{left:-120px;top:2500px;width:420px;height:420px;background:var(--a);opacity:.25}

/* ---------- Glass ---------- */
.glass{background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:1px solid var(--line);-webkit-backdrop-filter:blur(20px) saturate(140%);backdrop-filter:blur(20px) saturate(140%);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 24px 50px rgba(0,0,0,.35)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .glass{background:rgba(22,28,60,.94)}
}

/* ---------- Header ---------- */
.site-header{position:sticky;top:0;z-index:50;padding-top:14px}
.nav{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;padding:12px 14px 12px 20px;border-radius:20px;background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.04)),rgba(9,13,30,.72)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--head);font-weight:800;font-size:21px}
.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(145deg,var(--a),var(--b));display:grid;place-items:center;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 16px rgba(0,0,0,.35)}
.nav-links{display:flex;gap:28px;font-weight:500;font-size:15px;color:#cdd3f5}
.nav-links a:hover{color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;font:inherit;font-weight:700;font-size:14px;border-radius:14px;padding:11px 22px}
.btn-white{background:#fff;color:#0b1020;box-shadow:0 8px 24px rgba(255,255,255,.16)}
.btn-grad{background:linear-gradient(145deg,var(--a),var(--b));color:#06101f;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 22px rgba(0,0,0,.35)}
.menu-btn{display:none;width:42px;height:42px;padding:0;border-radius:12px;color:#fff;background:rgba(255,255,255,.1);border:1px solid var(--line);cursor:pointer;place-items:center}

/* ---------- Hero ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:32px;align-items:center;padding:56px 0 8px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;font-size:13px;font-weight:700;color:#dfe4ff}
.dot{width:8px;height:8px;border-radius:50%;background:var(--a);box-shadow:0 0 12px var(--a)}
h1{font-family:var(--head);font-size:clamp(40px,6.2vw,64px);line-height:1.04;font-weight:800;letter-spacing:-.025em;margin-top:22px}
h1 em{font-style:normal;color:var(--a);background:linear-gradient(90deg,var(--a),#a78bfa);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.lead{margin-top:20px;max-width:500px;font-size:18px;line-height:1.65;color:var(--muted)}
.search{display:flex;align-items:center;gap:8px;max-width:560px;margin-top:34px;padding:8px;border-radius:20px}
.search svg{margin-left:14px;flex:none;color:var(--muted)}
.search input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--ink);font:inherit;font-size:16px;padding:13px 6px}
.search input::placeholder{color:#8e98c7}
.search:focus-within{border-color:rgba(34,211,238,.75);box-shadow:0 0 0 4px rgba(34,211,238,.16),0 24px 50px rgba(0,0,0,.35)}
.search .btn{padding:14px 24px;font-size:15px;border-radius:14px}
kbd{font:inherit;font-size:12px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:3px 8px;margin-right:4px;flex:none}
.trust{display:flex;flex-wrap:wrap;gap:10px 28px;list-style:none;padding:0;margin:28px 0 0;font-size:14px;font-weight:500;color:#cdd3f5}
.trust li{display:inline-flex;align-items:center;gap:8px}
.trust svg{color:var(--a)}

/* ---------- 3D scene ---------- */
.scene{--mx:0;--my:0;--sheet:clamp(200px,25vw,300px);position:relative;height:clamp(340px,44vw,500px);perspective:1400px}
.scene .shadow{position:absolute;left:50%;bottom:8%;width:min(320px,70%);height:70px;transform:translateX(-50%);border-radius:50%;background:#000;opacity:.55;filter:blur(26px)}
.stack{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d;transform:rotateX(calc(58deg - var(--my) * 16deg)) rotateZ(calc(-38deg + var(--mx) * 30deg))}
.sheet{position:absolute;left:calc(var(--sheet) / -2);top:calc(var(--sheet) / -2);width:var(--sheet);height:var(--sheet);border-radius:30px;display:grid;place-items:center;font-family:var(--head);font-weight:800;font-size:clamp(44px,6vw,72px);color:#fff;background:linear-gradient(145deg,rgba(255,255,255,.22),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.34);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 30px 60px rgba(0,0,0,.4);transform:translateZ(var(--z));animation:bob 6s ease-in-out infinite}
.sheet.s1{--z:0px;opacity:.9}
.sheet.s2{--z:90px;animation-delay:-2s;opacity:.95}
.sheet.s3{--z:180px;animation-delay:-4s;color:var(--a);text-shadow:0 0 28px var(--a);background:linear-gradient(145deg,rgba(255,255,255,.3),rgba(255,255,255,.08))}
@keyframes bob{0%,100%{transform:translateZ(var(--z))}50%{transform:translateZ(calc(var(--z) + 16px))}}
.orb{position:absolute;border-radius:50%;translate:calc(var(--mx) * -44px) calc(var(--my) * -44px);animation:floaty 7s ease-in-out infinite}
.orb.o1{right:6%;top:6%;width:clamp(64px,8vw,96px);height:clamp(64px,8vw,96px);background:radial-gradient(circle at 30% 28%,#fff 0%,var(--a) 38%,var(--b) 78%,#120a3a 100%);box-shadow:0 24px 50px rgba(0,0,0,.45),0 0 60px var(--b)}
.orb.o2{left:4%;bottom:16%;width:clamp(40px,5vw,56px);height:clamp(40px,5vw,56px);translate:calc(var(--mx) * 34px) calc(var(--my) * 34px);animation-delay:-3s;background:radial-gradient(circle at 30% 28%,#fff 0%,#ff7ac0 40%,#7a1d5c 100%);box-shadow:0 16px 34px rgba(0,0,0,.45),0 0 40px var(--pink)}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.fchip{position:absolute;padding:10px 16px;border-radius:14px;font-size:14px;font-weight:700;translate:calc(var(--mx) * -18px) calc(var(--my) * -18px)}
.fchip.c1{left:0;top:14%}
.fchip.c2{right:0;bottom:30%}
.fchip.c3{left:18%;bottom:4%}

/* ---------- Sections ---------- */
section{position:relative;z-index:1}
.sec{padding-top:64px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:10px 20px;margin-bottom:26px}
h2{font-family:var(--head);font-size:clamp(26px,3.4vw,34px);font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:15px}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:28px}
.fbtn{font:inherit;font-weight:700;font-size:14px;color:#e3e7ff;padding:10px 20px;border-radius:999px;cursor:pointer;background:rgba(255,255,255,.07);border:1px solid var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.fbtn:hover{background:rgba(255,255,255,.13)}
.fbtn[aria-pressed="true"]{background:#fff;color:#0b1020;border-color:transparent}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.card{--rx:0deg;--ry:0deg;--lift:0px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:12px;padding:24px;border-radius:24px;transform:perspective(900px) rotateX(var(--rx)) rotateY(var(--ry)) translateY(var(--lift));transition:transform .18s ease-out,border-color .2s;will-change:transform}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .2s;background:radial-gradient(260px circle at var(--gx,50%) var(--gy,0%),rgba(255,255,255,.16),transparent 62%)}
.card.is-tilt{--lift:-6px;border-color:rgba(255,255,255,.32)}
.card.is-tilt::after{opacity:1}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tile{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;color:#fff;background:var(--g);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),inset 0 -4px 8px rgba(0,0,0,.25),0 12px 24px rgba(0,0,0,.4)}
.tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#cdd3f5;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--line)}
.card h3{font-family:var(--head);font-size:19px;font-weight:700}
.card p{font-size:14px;color:var(--muted)}
.open{margin-top:auto;padding-top:4px;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--a)}
.open svg{transition:transform .2s}
.card:hover .open svg{transform:translateX(4px)}
.card[data-cat="pdf"]{--g:linear-gradient(145deg,#22d3ee,#7c5cff)}
.card[data-cat="image"]{--g:linear-gradient(145deg,#34d399,#22d3ee)}
.card[data-cat="qr"]{--g:linear-gradient(145deg,#ff9a5a,#ff4fa3)}
.card[data-cat="text"]{--g:linear-gradient(145deg,#a78bfa,#ff4fa3)}
.card[data-cat="calc"]{--g:linear-gradient(145deg,#fbbf24,#ff8a3d)}
.card[data-cat="dev"]{--g:linear-gradient(145deg,#3b82f6,#7c5cff)}
.card[data-cat="video"]{--g:linear-gradient(145deg,#ff5a5f,#ff4fa3)}

.empty{padding:40px 24px;text-align:center;border-radius:24px}
.empty p{color:var(--muted);margin:8px 0 18px}

.more{margin-top:28px;border-radius:24px}
.more summary{cursor:pointer;list-style:none;padding:20px 24px;font-family:var(--head);font-weight:700;font-size:19px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.more summary::-webkit-details-marker{display:none}
.more summary span{font-family:'DM Sans',system-ui,sans-serif;font-size:14px;font-weight:500;color:var(--muted)}
.more summary svg{flex:none;transition:transform .2s}
.more[open] summary svg{transform:rotate(180deg)}
.xgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;padding:2px 20px 22px}
.xchip{padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-weight:700;font-size:14px;transition:background .2s}
.xchip:hover{background:rgba(255,255,255,.13)}
.xchip small{display:block;margin-top:2px;color:var(--muted);font-weight:400;font-size:12px}

/* ---------- Features / About / FAQ ---------- */
.features{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:28px;padding:40px;border-radius:30px}
.features h3{font-size:17px;font-weight:700}
.features p{margin-top:8px;font-size:14px;color:var(--muted)}
.about{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px}
.about article{padding:26px;border-radius:22px}
.about h3{font-family:var(--head);font-size:18px;font-weight:700}
.about p{margin-top:10px;font-size:14.5px;color:var(--muted)}
.about-intro{max-width:760px;color:var(--muted);margin:-8px 0 26px}
.faq{display:grid;gap:12px;max-width:860px}
.faq details{border-radius:18px}
.faq summary{cursor:pointer;list-style:none;padding:18px 22px;font-weight:700;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:14px}
.faq summary::-webkit-details-marker{display:none}
.faq summary svg{flex:none;transition:transform .2s}
.faq details[open] summary svg{transform:rotate(45deg)}
.faq details p{padding:0 22px 20px;color:var(--muted);font-size:15px}

/* ---------- Footer ---------- */
footer{position:relative;z-index:1;margin-top:80px;padding-bottom:32px}
.foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px 24px;padding:20px 26px;border-radius:20px;font-size:14px;color:var(--muted)}
.foot .brand{font-size:19px;color:#fff}
.foot nav{display:flex;flex-wrap:wrap;gap:8px 24px}
.foot a:hover{color:#fff}

/* ---------- Responsive ---------- */
@media (max-width:900px){
  .hero{grid-template-columns:minmax(0,1fr);padding-top:36px}
  .scene{height:400px;--sheet:210px;margin-top:36px}
  .features{padding:28px}
}
@media (max-width:780px){
  .menu-btn{display:inline-grid;margin-left:auto}
  .nav-links{display:none;order:3;width:100%;flex-direction:column;gap:2px;padding:6px 0 4px}
  .nav-links.open{display:flex}
  .nav-links a{padding:12px 8px;border-radius:10px}
  .nav-links a:hover{background:rgba(255,255,255,.08)}
  .nav .cta{display:none}
}
@media (max-width:560px){
  .wrap{padding-left:16px;padding-right:16px}
  .lead{font-size:16.5px}
  .search{padding:6px}
  .search kbd{display:none}
  .search .btn{padding:13px 18px}
  .grid{gap:16px}
  .fchip{font-size:13px;padding:8px 12px}
}
@media (hover:none){
  .search kbd{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>

<script>
(function () {
  var c = document.getElementById('c'), status = document.getElementById('status');
  var fields = { hex: document.getElementById('hex'), rgb: document.getElementById('rgb'), hsl: document.getElementById('hsl') };

  function toHsl(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    var max = Math.max(r, g, b), min = Math.min(r, g, b), h = 0, s = 0, l = (max + min) / 2, d = max - min;
    if (d) {
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      if (max === r) h = ((g - b) / d + (g < b ? 6 : 0));
      else if (max === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h *= 60;
    }
    return 'hsl(' + Math.round(h) + ', ' + Math.round(s * 100) + '%, ' + Math.round(l * 100) + '%)';
  }

  function update() {
    var hex = c.value.toUpperCase();
    var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    fields.hex.value = hex;
    fields.rgb.value = 'rgb(' + r + ', ' + g + ', ' + b + ')';
    fields.hsl.value = toHsl(r, g, b);
    document.getElementById('swatch').style.background = hex;
    status.textContent = '';
  }

  function copy(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function (resolve, reject) {
      try {
        var t = document.createElement('textarea');
        t.value = text; t.style.position = 'fixed'; t.style.opacity = '0';
        document.body.appendChild(t); t.select();
        var ok = document.execCommand('copy');
        document.body.removeChild(t);
        ok ? resolve() : reject();
      } catch (e) { reject(e); }
    });
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-copy]');
    if (!b) return;
    var field = fields[b.getAttribute('data-copy')];
    copy(field.value).then(function () {
      status.textContent = 'Copied ' + field.value;
    }, function () {
      field.select();
      status.textContent = 'Press Ctrl + C to copy';
    });
  });

  c.addEventListener('input', update);
  update();

  var nav = document.getElementById('menubtn'), links = document.getElementById('navlinks');
  if (nav && links) {
    nav.addEventListener('click', function () {
      var open = links.classList.toggle('open');
      nav.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
  }
})();
</script>
</body>
</html>
