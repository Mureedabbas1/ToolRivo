<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JPG to PDF Converter Online Free | ToolRivo</title><meta name="description" content="Convert JPG images to a PDF online for free with ToolRivo. Combine multiple images into one PDF."><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><style>body{font-family:Arial;background:#f5f7fa;color:#102331}.wrap{max-width:760px;margin:60px auto;padding:28px;background:white;border-radius:20px;box-shadow:0 10px 35px #0001}h1{color:#126e68}.btn{padding:12px 18px;border:0;border-radius:10px;background:#126e68;color:white;font-weight:700;cursor:pointer}.status{margin-top:15px}</style></head><body><div class="wrap"><a href="index.html">← ToolRivo</a><h1>JPG to PDF Converter</h1><p>Convert one or more JPG images into a single PDF.</p><input id="f" type="file" accept="image/jpeg,image/png" multiple><br><button class="btn" onclick="run()">Convert to PDF</button><div class="status" id="s"></div></div><script>async function run(){const fs=[...document.querySelector('#f').files];if(!fs.length)return s.textContent='Choose images.';s.textContent='Creating PDF...';try{const pdf=await PDFLib.PDFDocument.create();for(const f of fs){const img=f.type==='image/png'?await pdf.embedPng(await f.arrayBuffer()):await pdf.embedJpg(await f.arrayBuffer());const scale=Math.min(1,560/img.width,780/img.height);const p=pdf.addPage([img.width*scale,img.height*scale]);p.drawImage(img,{x:0,y:0,width:img.width*scale,height:img.height*scale})}const b=await pdf.save();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([b],{type:'application/pdf'}));a.download='images.pdf';a.click();s.textContent='Done.'}catch(e){s.textContent='Could not convert these images.'}}</script></body></html>
