<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Extract PDF Pages Online Free | ToolRivo</title><meta name="description" content="Extract selected pages from a PDF into a new PDF online for free."><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><style>body{font-family:Arial;background:#f5f7fa;color:#102331}.wrap{max-width:760px;margin:60px auto;padding:28px;background:white;border-radius:20px;box-shadow:0 10px 35px #0001}h1{color:#126e68}.btn{padding:12px 18px;border:0;border-radius:10px;background:#126e68;color:white;font-weight:700;cursor:pointer}.status{margin-top:15px}</style></head><body><div class="wrap"><a href="index.html">← ToolRivo</a><h1>Extract PDF Pages</h1><p>Enter the pages you want to extract, such as 1,3,5.</p><input id="f" type="file" accept="application/pdf"><br><input id="pages" placeholder="1,3,5"><br><button class="btn" onclick="run()">Extract Pages</button><div class="status" id="s"></div></div><script>async function run(){const f=document.querySelector('#f').files[0];if(!f)return s.textContent='Choose a PDF.';const nums=[...new Set((pages.value.match(/\d+/g)||[]).map(x=>+x-1))];if(!nums.length)return s.textContent='Enter page numbers.';s.textContent='Extracting...';try{const src=await PDFLib.PDFDocument.load(await f.arrayBuffer()),out=await PDFLib.PDFDocument.create();const valid=nums.filter(i=>i>=0&&i<src.getPageCount());const ps=await out.copyPages(src,valid);ps.forEach(p=>out.addPage(p));const b=await out.save();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([b],{type:'application/pdf'}));a.download='extracted-pages.pdf';a.click();s.textContent='Done.'}catch(e){s.textContent='Could not process this PDF.'}}</script></body></html>
