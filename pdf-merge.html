<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Merge PDF Online Free | ToolRivo</title><meta name="description" content="Merge multiple PDF files into one PDF online for free with ToolRivo. Fast browser-based PDF merger."><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><style>body{font-family:Arial;background:#f5f7fa;color:#102331;margin:0}.wrap{max-width:760px;margin:60px auto;padding:28px;background:white;border-radius:20px;box-shadow:0 10px 35px #0001}h1{color:#126e68}.btn{padding:12px 18px;border:0;border-radius:10px;background:#126e68;color:white;font-weight:700;cursor:pointer;margin:8px 5px 8px 0}input{margin:15px 0}.status{margin-top:18px;font-weight:600}a{color:#126e68}</style></head><body><div class="wrap"><a href="index.html">← ToolRivo</a><h1>Merge PDF Online</h1><p>Combine multiple PDF files into one document directly in your browser.</p><input id="files" type="file" accept="application/pdf" multiple><br><button class="btn" onclick="merge()">Merge PDFs</button><div class="status" id="s"></div></div><script>async function merge(){const fs=[...document.querySelector('#files').files];if(fs.length<2)return s.textContent='Select at least 2 PDF files.';s.textContent='Merging...';try{const out=await PDFLib.PDFDocument.create();for(const f of fs){const src=await PDFLib.PDFDocument.load(await f.arrayBuffer());const pages=await out.copyPages(src,src.getPageIndices());pages.forEach(p=>out.addPage(p))}const b=await out.save();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([b],{type:'application/pdf'}));a.download='merged.pdf';a.click();s.textContent='Done — your merged PDF was downloaded.'}catch(e){s.textContent='Could not merge this PDF. Try non-encrypted files.'}}</script></body></html>
