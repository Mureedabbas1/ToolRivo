<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compress PDF Online Free | ToolRivo</title><meta name="description" content="Compress PDF files online for free with ToolRivo. Reduce PDF size in your browser without uploading to a server."><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><style>body{font-family:Arial;background:#f5f7fa;color:#102331}.wrap{max-width:760px;margin:60px auto;padding:28px;background:white;border-radius:20px;box-shadow:0 10px 35px #0001}h1{color:#126e68}.btn{padding:12px 18px;border:0;border-radius:10px;background:#126e68;color:white;font-weight:700;cursor:pointer;margin-top:12px}.status{margin-top:15px;font-weight:600}</style></head><body><div class="wrap"><a href="index.html">← ToolRivo</a><h1>Compress PDF Online</h1><p>Reduce PDF file size in your browser by rebuilding pages as optimized JPEG images. Best for scanned/image-heavy PDFs.</p><input id="f" type="file" accept="application/pdf"><br><label>Quality <input id="q" type="range" min="0.35" max="0.85" step="0.05" value="0.6"> <span id="qv">0.60</span></label><br><button class="btn" onclick="run()">Compress PDF</button><div class="status" id="s"></div></div><script>const q=document.querySelector('#q');q.oninput=()=>document.querySelector('#qv').textContent=q.value;async function run(){const f=document.querySelector('#f').files[0];if(!f)return s.textContent='Choose a PDF first.';s.textContent='Rendering pages...';try{const pdfjs=await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs');pdfjs.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';const doc=await pdfjs.getDocument({data:await f.arrayBuffer()}).promise;const out=await PDFLib.PDFDocument.create();for(let i=1;i<=doc.numPages;i++){s.textContent='Compressing page '+i+' of '+doc.numPages+'...';const page=await doc.getPage(i);const vp=page.getViewport({scale:1.25});const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',+q.value));const img=await out.embedJpg(await blob.arrayBuffer());const p=out.addPage([img.width,img.height]);p.drawImage(img,{x:0,y:0,width:img.width,height:img.height})}const b=await out.save({useObjectStreams:true});const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([b],{type:'application/pdf'}));a.download='compressed.pdf';a.click();s.textContent='Done. Original: '+(f.size/1048576).toFixed(2)+' MB • New: '+(b.length/1048576).toFixed(2)+' MB';}catch(e){console.error(e);s.textContent='Could not compress this PDF. Some complex/encrypted PDFs may not be supported.'}}</script></body></html>
