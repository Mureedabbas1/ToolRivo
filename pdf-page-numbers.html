<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Page Numbers to PDF Online | ToolRivo</title><meta name="description" content="Add page numbers to PDF files online for free with ToolRivo."><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><style>body{font-family:Arial;background:#f5f7fa;color:#102331}.wrap{max-width:760px;margin:60px auto;padding:28px;background:white;border-radius:20px}.btn{padding:12px 18px;border:0;border-radius:10px;background:#126e68;color:white;font-weight:700;cursor:pointer}</style></head><body><div class="wrap"><a href="index.html">← ToolRivo</a><h1>Add Page Numbers to PDF</h1><input id="f" type="file" accept="application/pdf"><br><button class="btn" onclick="run()">Add Page Numbers</button><p id="s"></p></div><script>async function run(){const f=document.querySelector('#f').files[0];if(!f)return s.textContent='Choose a PDF.';s.textContent='Processing...';try{const p=await PDFLib.PDFDocument.load(await f.arrayBuffer());p.getPages().forEach((x,i)=>{const {width}=x.getSize();x.drawText(String(i+1),{x:width/2-5,y:18,size:10,color:PDFLib.rgb(.25,.25,.25)})});const b=await p.save();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([b],{type:'application/pdf'}));a.download='numbered.pdf';a.click();s.textContent='Done.'}catch(e){s.textContent='Could not process this PDF.'}}</script></body></html>
