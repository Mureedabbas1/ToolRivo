<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Remove Pages from PDF Online | ToolRivo</title><meta name="description" content="Remove selected pages from a PDF online for free."><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><style>body{font-family:Arial;background:#f5f7fa;color:#102331}.wrap{max-width:760px;margin:60px auto;padding:28px;background:white;border-radius:20px;box-shadow:0 10px 35px #0001}h1{color:#126e68}.btn{padding:12px 18px;border:0;border-radius:10px;background:#126e68;color:white;font-weight:700;cursor:pointer}.status{margin-top:15px}</style></head><body><div class="wrap"><a href="index.html">← ToolRivo</a><h1>Remove PDF Pages</h1><p>Enter page numbers to remove, separated by commas. Example: 2,5,7.</p><input id="f" type="file" accept="application/pdf"><br><input id="pages" placeholder="2,5,7"><br><button class="btn" onclick="run()">Remove Pages</button><div class="status" id="s"></div></div><script>async function run(){const f=document.querySelector('#f').files[0];if(!f)return s.textContent='Choose a PDF.';const nums=new Set((pages.value.match(/\d+/g)||[]).map(x=>+x-1));s.textContent='Processing...';try{const src=await PDFLib.PDFDocument.load(await f.arrayBuffer()),out=await PDFLib.PDFDocument.create();const keep=src.getPageIndices().filter(i=>!nums.has(i));if(!keep.length)return s.textContent='You cannot remove all pages.';const ps=await out.copyPages(src,keep);ps.forEach(p=>out.addPage(p));const b=await out.save();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([b],{type:'application/pdf'}));a.download='pdf-with-pages-removed.pdf';a.click();s.textContent='Done.'}catch(e){s.textContent='Could not process this PDF.'}}</script></body></html>
