<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Organize PDF Pages Online | ToolRivo</title><meta name="description" content="Reorder PDF pages online for free with ToolRivo. Enter the new page order and download your PDF."><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><style>body{font-family:Arial;background:#f5f7fa;color:#102331}.wrap{max-width:760px;margin:60px auto;padding:28px;background:white;border-radius:20px;box-shadow:0 10px 35px #0001}h1{color:#126e68}.btn{padding:12px 18px;border:0;border-radius:10px;background:#126e68;color:white;font-weight:700;cursor:pointer}.status{margin-top:15px}</style></head><body><div class="wrap"><a href="index.html">← ToolRivo</a><h1>Organize PDF Pages</h1><p>Reorder pages by entering a new order. Example for 5 pages: 3,1,2,5,4.</p><input id="f" type="file" accept="application/pdf"><br><input id="order" style="width:90%" placeholder="3,1,2,5,4"><br><button class="btn" onclick="run()">Organize PDF</button><div class="status" id="s"></div></div><script>async function run(){const f=document.querySelector('#f').files[0];if(!f)return s.textContent='Choose a PDF.';const order=(document.querySelector('#order').value.match(/\d+/g)||[]).map(x=>+x-1);s.textContent='Processing...';try{const src=await PDFLib.PDFDocument.load(await f.arrayBuffer()),out=await PDFLib.PDFDocument.create();if(!order.length)return s.textContent='Enter the new page order.';const valid=order.filter(i=>i>=0&&i<src.getPageCount());const ps=await out.copyPages(src,valid);ps.forEach(p=>out.addPage(p));const b=await out.save();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([b],{type:'application/pdf'}));a.download='organized.pdf';a.click();s.textContent='Done.'}catch(e){s.textContent='Could not organize this PDF.'}}</script></body></html>
