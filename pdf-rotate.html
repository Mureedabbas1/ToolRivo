<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rotate PDF Online Free | ToolRivo</title><meta name="description" content="Rotate all PDF pages by 90, 180 or 270 degrees online for free."><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><style>body{font-family:Arial;background:#f5f7fa;color:#102331}.wrap{max-width:760px;margin:60px auto;padding:28px;background:white;border-radius:20px}.btn{padding:12px 18px;border:0;border-radius:10px;background:#126e68;color:white;font-weight:700;cursor:pointer}</style></head><body><div class="wrap"><a href="index.html">← ToolRivo</a><h1>Rotate PDF</h1><p>Rotate every page in a PDF by 90, 180 or 270 degrees.</p><input id="f" type="file" accept="application/pdf"><select id="deg"><option>90</option><option>180</option><option>270</option></select><br><button class="btn" onclick="run()">Rotate PDF</button><p id="s"></p></div><script>async function run(){const f=document.querySelector('#f').files[0];if(!f)return s.textContent='Choose a PDF.';s.textContent='Processing...';try{const p=await PDFLib.PDFDocument.load(await f.arrayBuffer()),d=+deg.value;p.getPages().forEach(x=>x.setRotation(PDFLib.degrees((x.getRotation().angle+d)%360)));const b=await p.save();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([b],{type:'application/pdf'}));a.download='rotated.pdf';a.click();s.textContent='Done.'}catch(e){s.textContent='Could not rotate this PDF.'}}</script></body></html>
