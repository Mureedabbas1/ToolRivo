<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Split PDF Online Free | ToolRivo</title><meta name="description" content="Split a PDF into separate pages online for free with ToolRivo."><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><style>body{font-family:Arial;background:#f5f7fa;color:#102331}.wrap{max-width:760px;margin:60px auto;padding:28px;background:white;border-radius:20px;box-shadow:0 10px 35px #0001}h1{color:#126e68}.btn{padding:12px 18px;border:0;border-radius:10px;background:#126e68;color:white;font-weight:700;cursor:pointer;margin-top:12px}.status{margin-top:18px;font-weight:600}</style></head><body><div class="wrap"><a href="index.html">← ToolRivo</a><h1>Split PDF Online</h1><p>Choose a PDF and split it into one PDF file per page.</p><input id="f" type="file" accept="application/pdf"><br><button class="btn" onclick="split()">Split PDF</button><div class="status" id="s"></div></div><script>async function split(){const f=document.querySelector('#f').files[0];if(!f)return s.textContent='Choose a PDF first.';s.textContent='Splitting...';try{const src=await PDFLib.PDFDocument.load(await f.arrayBuffer());for(let i=0;i<src.getPageCount();i++){const out=await PDFLib.PDFDocument.create();const [p]=await out.copyPages(src,[i]);out.addPage(p);const b=await out.save();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([b],{type:'application/pdf'}));a.download='page-'+(i+1)+'.pdf';a.click();await new Promise(r=>setTimeout(r,120))}s.textContent='Done — separate PDF pages downloaded.'}catch(e){s.textContent='Could not split this PDF.'}}</script></body></html>
